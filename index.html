<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FOODIEINDIA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Hero Container with Background Image + Dark Overlay like Netflix */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      /* Background Image setup */
      background: linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.75)
                  ),
                  url("{{ url_for('static', filename='images/hero-bg.jpg') }}") no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    /* Top Navigation Bar */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 25px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 2rem;
      font-weight: 800;
      color: #e50914; /* Red color matching Netflix/Foodie style */
      text-decoration: none;
      letter-spacing: 1px;
    }

    /* Centered Text Content */
    .hero-content h1 {
      font-size: 3.2rem;
      font-weight: 900;
      margin-bottom: 15px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }

    .hero-content p {
      font-size: 1.3rem;
      margin-bottom: 25px;
      color: #e6e6e6;
    }

    /* Search Bar Form */
    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .search-input {
      width: 70%;
      padding: 16px 20px;
      font-size: 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      outline: none;
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-btn {
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      background-color: #e50914;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    .search-btn:hover {
      background-color: #f40612;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- Navbar -->
    <div class="navbar">
      <a href="#" class="brand-logo">FOODIEINDIA</a>
    </div>

    <!-- Main Center Hero Content -->
    <div class="hero-content">
      <h1>Unlimited flavors, restaurants, & more</h1>
      <p>Discover top food spots near you. Search by city anytime.</p>

      <!-- Search Form -->
      <form action="/search" method="GET" class="search-box">
        <input
          type="text"
          name="city"
          class="search-input"
          placeholder="Enter your city (e.g. Hyderabad)"
          required
        >
        <button type="submit" class="search-btn">Search ›</button>
      </form>
    </div>
  </div>

</body>
</html>
