<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FOODIEINDIA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.85)),
                  url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200") no-repeat center center/cover;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .navbar { padding: 25px 50px; }
    .brand-logo { font-size: 2.2rem; font-weight: 800; color: #e50914; text-decoration: none; letter-spacing: 1.5px; }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(0, 0, 0, 0.8); border-radius: 8px; padding: 40px 50px; width: 100%; max-width: 450px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .card h2 { font-size: 2rem; margin-bottom: 20px; }
    .flash-msg { color: #ff3333; font-size: 0.9rem; margin-bottom: 15px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-input { width: 100%; padding: 14px 18px; font-size: 1rem; border-radius: 4px; border: 1px solid #333; background: #333; color: #fff; outline: none; }
    .form-input:focus { background: #454545; border-color: #e50914; }
    .submit-btn { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; background-color: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .submit-btn:hover { background-color: #f40612; }
    .footer-text { margin-top: 25px; color: #737373; font-size: 0.95rem; }
    .footer-text a { color: #fff; text-decoration: none; }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="/" class="brand-logo">FOODIEINDIA</a>
  </div>

  <div class="container">
    <div class="card">
      <h2>Sign In</h2>

      <!-- Flash error messages -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="flash-msg">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/login" method="POST">
        <div class="form-group">
          <input type="text" name="username" class="form-input" placeholder="Username" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" class="form-input" placeholder="Password" required>
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="footer-text">
        New to FoodieIndia? <a href="/signup">Sign up now</a>.
      </div>
    </div>
  </div>

</body>
</html>
